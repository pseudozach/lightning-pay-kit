name: Provider directory audit

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check provider metadata and links
        id: audit
        continue-on-error: true
        run: pnpm audit:providers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-audit
          path: reports/provider-audit.json
          retention-days: 30
      - name: Open or resolve the audit issue
        if: always()
        uses: actions/github-script@v7
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const title = '[automated] Provider directory audit needs review';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title);
            if (process.env.AUDIT_OUTCOME === 'success') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'The scheduled provider audit is clean again; closing this issue.'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed'
                });
              }
              return;
            }
            const report = JSON.parse(fs.readFileSync('reports/provider-audit.json', 'utf8'));
            const broken = report.links.filter((link) => !link.reachable);
            const details = [
              `Metadata issues: ${report.summary.metadataIssueCount}`,
              `Broken links: ${report.summary.brokenLinkCount}`,
              '',
              ...report.metadataIssues.map((issue) => `- ${issue.providerId}: ${issue.message}`),
              ...broken.map((link) => `- ${link.providerId} ${link.kind}: ${link.url} (${link.error})`),
              '',
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: details
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: details
              });
            }
      - name: Fail when review is required
        if: steps.audit.outcome != 'success'
        run: exit 1
